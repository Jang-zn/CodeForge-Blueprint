appId: com.codeforge.blueprint
productName: CodeForge Blueprint
copyright: Copyright © 2025 CodeForge

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/*/{test,tests,__tests__,*.spec.*,*.test.*}"
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,LICENSE}"
  - "!**/*.map"

# better-sqlite3 등 네이티브 모듈을 Electron ABI에 맞게 리빌드
npmRebuild: true

# electron-builder가 build/icon.png에서 자동 변환
icon: build/icon.png

mac:
  target:
    - target: dmg
      arch:
        - arm64  # Apple Silicon
        - x64    # Intel
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: CodeForge Blueprint
  createDesktopShortcut: true
  createStartMenuShortcut: true
